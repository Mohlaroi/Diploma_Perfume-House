<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | Дом Парфюмерии - купить оригинальные духи в Ростове-на-Дону</title>
    <meta name="description" content="Каталог оригинальных духов в Ростове-на-Дону. Нишевая парфюмерия, арабские духи, масла на разлив. Доставка по России.">
    
    <!-- OpenGraph -->
    <meta property="og:title" content="Каталог духов | Дом Парфюмерии">
    <meta property="og:description" content="Оригинальные духи из Дубая и Европы в Ростове-на-Дону">
    <meta property="og:image" content="images/catalog-hero.jpg">
    <meta property="og:type" content="website">
    
    <!-- Шрифты + Иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalog.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
</head>
<body>
    <!-- Верхняя панель -->
    <div id="header-placeholder">Загрузка навигации...</div>

    <!-- Основное содержание -->
    <main class="catalog-main">
        <div class="container">
            <!-- Заголовок -->
            <div class="catalog-header">
                <div class="breadcrumbs">
                    <a href="index.html">Главная</a><span>/</span><span class="current">Каталог</span>
                </div>
                <h1 class="catalog-title">Товары</h1>
                <div class="catalog-controls">
                    <button class="filter-toggle" id="filterToggle"><span>Показать фильтры</span></button>
                    <div class="sort-control">
                        <select id="sortSelect" class="sort-select">
                            <option value="featured">По умолчанию</option>
                            <option value="price-asc">Цена: по возрастанию</option>
                            <option value="price-desc">Цена: по убыванию</option>
                            <option value="name-asc">Название: А-Я</option>
                            <option value="name-desc">Название: Я-А</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Активные фильтры -->
            <div class="active-filters" id="activeFilters"></div>

            <!-- Контент -->
            <div class="catalog-content">
                <!-- Модальные фильтры -->
                <div class="filters-modal" id="filtersModal">
                    <div class="modal-overlay"></div>
                    <div class="modal-content">
                        <div class="modal-header">
                            <h3>Фильтры</h3>
                            <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">
                            <!-- Категории -->
                            <div class="filter-group">
                                <h4>Категории</h4>
                                <div class="filter-options">
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="women"><span class="checkmark"></span><span class="option-text">Женские духи</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="men"><span class="checkmark"></span><span class="option-text">Мужские духи</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="unisex"><span class="checkmark"></span><span class="option-text">Унисекс</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="niche"><span class="checkmark"></span><span class="option-text">Нишевые</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="arabic"><span class="checkmark"></span><span class="option-text">Арабские</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="oils"><span class="checkmark"></span><span class="option-text">Масла на разлив</span>
                                    </label>
                                </div>
                            </div>
                            
                            <!-- Бренды -->
                            <div class="filter-group">
                                <h4>Бренды</h4>
                                <div class="filter-options">
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="initio"><span class="checkmark"></span><span class="option-text">Initio Parfums</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="memo"><span class="checkmark"></span><span class="option-text">Memo Paris</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="moudon"><span class="checkmark"></span><span class="option-text">Moudon</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="lattafa"><span class="checkmark"></span><span class="option-text">Lattafa</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="swiss"><span class="checkmark"></span><span class="option-text">Swiss Arabian</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="louizon"><span class="checkmark"></span><span class="option-text">Louizon</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="chopard"><span class="checkmark"></span><span class="option-text">Chopard</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="brand" value="rasasi"><span class="checkmark"></span><span class="option-text">Rasasi</span>
                                    </label>
                                </div>
                            </div>
                            <div class="filter-group">
                                <h4>Спецпредложения</h4>
                                <div class="filter-options">
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="new"><span class="checkmark"></span><span class="option-text">Новинки</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="bestseller"><span class="checkmark"></span><span class="option-text">Хиты продаж</span>
                                    </label>
                                    <label class="filter-option">
                                        <input type="checkbox" name="category" value="sale"><span class="checkmark"></span><span class="option-text">Распродажа</span>
                                    </label>                  
                                </div>
                            </div>                            
                        </div>
                        <div class="modal-footer">
                            <button class="btn-clear" id="clearFilters">Очистить все</button>
                            <button class="btn-apply" id="applyFilters">Применить фильтры</button>
                        </div>
                    </div>
                </div>

                <!-- 🔥 ТОВАРЫ ГЕНЕРИРУЮТСЯ JS (catalog.js) 🔥 -->
                <div class="products-grid" id="productsGrid">
                    <!-- Товары будут загружены динамически -->
                </div>
            </div>
        </div>
    </main>

    <!-- Футер -->
    <div id="footer-placeholder">Загрузка футера...</div>

    <!-- Скрипты (defer для скорости) -->
    <script src="js/main.js" defer></script>
    <script src="js/catalog.js" defer></script>
    <script src="js/include.js"></script>
</body>
</html>
