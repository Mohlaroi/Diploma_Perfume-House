<!DOCTYPE html>
<html>
<head>
    <title>Тест входа - упрощенный</title>
    <style>
        body { font-family: Arial; padding: 40px; max-width: 500px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-top: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>🔧 Тест авторизации</h1>
    
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="email" value="test@example.com">
    </div>
    
    <div class="form-group">
        <label>Пароль:</label>
        <input type="password" id="password" value="Test123!">
    </div>
    
    <button onclick="testSimpleLogin()">Протестировать вход</button>
    <button onclick="testSimpleRegister()">Протестировать регистрацию</button>
    
    <div id="result" class="result"></div>
    
    <script>
    async function testSimpleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const result = document.getElementById('result');
        
        result.innerHTML = 'Отправка запроса...';
        
        try {
            // Пробуем разные пути
            const endpoints = [
                'php/login.php',
                '/frontend/php/login.php',
                '../php/login.php',
                'login.php'
            ];
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({email, password})
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        result.innerHTML = `
                            <div class="success">
                                <strong>✅ Успех!</strong><br>
                                Конечная точка: ${endpoint}<br>
                                Сообщение: ${data.message}<br>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        `;
                        return;
                    }
                } catch (e) {
                    console.log(`${endpoint} не сработал:`, e.message);
                }
            }
            
            result.innerHTML = `<div class="error">❌ Все пути не сработали</div>`;
            
        } catch(error) {
            result.innerHTML = `<div class="error">❌ Ошибка: ${error.message}</div>`;
        }
    }
    
    function testSimpleRegister() {
        const result = document.getElementById('result');
        result.innerHTML = `
            <div class="success">
                <strong>📝 Тест регистрации</strong><br>
                Для теста используйте:<br>
                Имя: Тест<br>
                Фамилия: Тестов<br>
                Email: test2@example.com<br>
                Пароль: Test123!<br>
                <button onclick="runTestRegister()">Зарегистрировать</button>
            </div>
        `;
    }
    
    async function runTestRegister() {
        const data = {
            first_name: 'Тест',
            last_name: 'Тестов',
            email: 'test2@example.com',
            password: 'Test123!',
            confirm_password: 'Test123!',
            consent_pd: true,
            age_confirm: true
        };
        
        try {
            const response = await fetch('php/register.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            document.getElementById('result').innerHTML = `
                <div class="${result.success ? 'success' : 'error'}">
                    <strong>${result.success ? '✅' : '❌'} ${result.message}</strong>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                </div>
            `;
        } catch(error) {
            document.getElementById('result').innerHTML = `
                <div class="error">❌ Ошибка: ${error.message}</div>
            `;
        }
    }
    </script>
</body>
</html>
